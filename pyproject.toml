[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civicledger"
version = "1.0.0"
description = "Evidence-first procurement analysis and decision-sensitive entity review"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "duckdb==2.0.0", "dbt-duckdb==1.11.0", "requests==2.34.2",
  "numpy==2.5.4", "pandas==3.1.0", "scipy==1.18.1",
  "scikit-learn==1.9.1", "splink==5.0.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["civicledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
